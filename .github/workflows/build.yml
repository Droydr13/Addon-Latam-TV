name: Generar addon de canales

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repo
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install

      - name: Correr build.js
        run: node build.js

      - name: Subir manifest.json, catalog/, meta/, stream/ y logos/ actualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json catalog meta stream logos
          git diff --staged --quiet || git commit -m "Actualiza canales generados [skip ci]"
          git push
